name: Refresh publisher news images v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/download_news_images.py'
      - '.github/workflows/news-images.yml'
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/download_news_images.py
      - name: Commit verified publisher photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/news/ assets/news-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Cache news photography from original articles"
            git push
          fi
