name: Download verified football crests
on:
  workflow_dispatch:
  push:
    paths:
      - 'brief.json'
      - 'scripts/download_logos.py'
      - 'scripts/validate_brief.py'
      - 'scripts/download_news_images.py'
      - '.github/workflows/logos.yml'
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install pillow
      - name: Download genuine team and competition logos
        run: python scripts/download_logos.py
      - name: Validate all match crests and league badges
        run: python scripts/validate_brief.py
      - name: Download source-linked news photos
        run: python scripts/download_news_images.py
      - name: Commit logo image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Cache verified football badges for daily brief"
            git push
          fi
