name: Download club and league logo images
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/logos.yml'
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and save images
        run: python scripts/download_logos.py
      - name: Commit image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/
          if ! git diff --cached --quiet; then
            git commit -m "Cache football team and competition logo images"
            git push
          fi
