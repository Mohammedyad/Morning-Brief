<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>الموجز الصباحي</title><style>body{background:#000;color:#fff;font-family:system-ui;margin:0;padding:32px 20px}main{max-width:680px;margin:auto}button{background:#27272a;color:#fff;border:0;border-radius:12px;padding:14px;cursor:pointer}.active{background:#555}article{background:#1c1c1e;padding:18px;border-radius:18px;margin:12px 0}a{color:#9ac5ff}p{color:#bbb;line-height:1.7}</style><main><small>الموجز الصباحي • الرياض</small><h1>صباحك مختصر.</h1><p id="updated">جارٍ تحميل التحديث...</p><nav><button class="active" onclick="tab('news',this)">أخبار اليوم</button> <button onclick="tab('sports',this)">مباريات اليوم</button></nav><section id="news"><h2>الأخبار</h2><div id="newsItems">جارٍ التحميل...</div></section><section id="sports" hidden><h2>المباريات</h2><div id="sportsItems">جارٍ التحميل...</div></section><p>لا تُعرض أخبار أو مباريات غير موثقة.</p></main><script>function tab(id,btn){document.querySelectorAll('section').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function add(parent,item,sport){let a=document.createElement('article'),h=document.createElement('h3');h.textContent=sport?item.home+' × '+item.away:item.title;a.append(h);let p=document.createElement('p');p.textContent=sport?(item.league||'')+' • '+(item.time||''):(item.summary||'');a.append(p);if(item.url){let l=document.createElement('a');l.href=item.url;l.textContent='المصدر';l.target='_blank';l.rel='noopener';a.append(l)}parent.append(a)}fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('updated').textContent='آخر تحديث: '+d.updated_at;for(let [id,arr,sport] of [['newsItems',d.news,false],['sportsItems',d.matches,true]]){let e=document.getElementById(id);e.textContent='';if(!arr.length)e.textContent='لا توجد بيانات موثقة لهذا اليوم';arr.forEach(x=>add(e,x,sport))}}).catch(()=>{document.getElementById('updated').textContent='تعذر تحميل التحديث'})</script></html>
