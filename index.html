<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e"><title>الموجز الصباحي</title>
<style>
:root{color-scheme:dark;--bg:#07090e;--panel:#111722;--muted:#98a4b7;--line:#253044;--blue:#4c9dff;--green:#43d5a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}main{max-width:850px;margin:auto;padding:28px 15px 90px}.eyebrow{font-size:12px;letter-spacing:.4px;color:var(--green);font-weight:700}.top{padding:16px 5px 23px}.top h1{font-size:clamp(29px,6vw,43px);margin:10px 0 6px;letter-spacing:-1px}.date{color:var(--muted);font-size:13px;line-height:1.8}.tabs{display:flex;background:#121824;padding:5px;border:1px solid #253044;border-radius:15px;gap:5px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(15px)}.tabs button{flex:1;border:0;border-radius:11px;background:transparent;color:#aeb8c8;padding:12px 8px;font:700 14px inherit;cursor:pointer}.tabs button.active{background:#27548b;color:#fff;box-shadow:0 2px 14px #123a6d55}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 12px;gap:10px}.section-head h2{margin:0;font-size:21px}.count{font-size:12px;color:#9faec2;background:#1a2534;border:1px solid #283a52;padding:6px 9px;border-radius:20px}.league{margin:18px 0 22px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--panel)}.league-head{padding:13px 15px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;background:linear-gradient(100deg,#182943,#111925);border-bottom:1px solid var(--line)}.league-head i{width:5px;height:19px;border-radius:8px;background:#4c9dff;display:block}.league-head .num{margin-inline-start:auto;color:#9eb0ca;font-size:11px;font-weight:500}.match{display:grid;grid-template-columns:minmax(0,1fr) 67px minmax(0,1fr);gap:5px;align-items:center;padding:12px 9px;border-bottom:1px solid #263040;min-height:70px}.match:last-child{border-bottom:0}.team{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;font-weight:700}.team.home{justify-content:flex-end;text-align:left;flex-direction:row-reverse}.team.away{text-align:right}.team span{overflow-wrap:anywhere;line-height:1.35}.crest{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:#27374c;color:#dcecff;font-weight:800;font-size:12px;border:1px solid #45546b;object-fit:contain;padding:3px}.time{color:#e9f3ff;background:#223855;border:1px solid #38547b;border-radius:9px;padding:7px 2px;text-align:center;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}.legend{font-size:11px;color:#8e9eb4;margin:8px 3px 14px}.story{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:11px 0}.story .cat{color:#61b4ff;font-size:11px;font-weight:700}.story h3{font-size:16px;line-height:1.55;margin:8px 0}.story p{font-size:13px;line-height:1.8;color:#abb8ca;margin:0}.story .source{font-size:11px;color:#70d5aa;margin-top:12px}.empty{padding:24px;color:var(--muted)}footer{margin:35px 4px;color:#748399;font-size:11px;line-height:1.8}@media(min-width:620px){.match{padding:13px 23px;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr)}.team{font-size:15px}.crest{width:40px;height:40px;flex-basis:40px}.time{font-size:14px}}
</style></head><body><main><header class="top"><div class="eyebrow">● THE MORNING BRIEF · RIYADH</div><h1>الموجز الصباحي</h1><div class="date" id="updated">جارٍ تحميل بيانات اليوم…</div></header><nav class="tabs"><button class="active" id="sportsBtn" onclick="tab('sports')">⚽ مباريات اليوم</button><button id="newsBtn" onclick="tab('news')">◉ أخبار اليوم</button></nav><section id="sports"><div class="section-head"><h2>جدول المباريات</h2><span class="count" id="matchCount"></span></div><div class="legend">جميع المواعيد بتوقيت الرياض (GMT+3) · شعارات الفرق تُحمّل من قاعدة بيانات رياضية خارجية</div><div id="sportsItems" class="empty">جارٍ التحميل…</div></section><section id="news" hidden><div class="section-head"><h2>أبرز الأخبار</h2><span class="count" id="newsCount"></span></div><div id="newsItems" class="empty">جارٍ التحميل…</div></section><footer>المحتوى وروابط المصادر للمتابعة والتحقق. آخر تحديث ظاهر أعلاه.</footer></main><script>
function tab(id){for(const s of document.querySelectorAll('main>section'))s.hidden=s.id!==id;for(const b of document.querySelectorAll('.tabs button'))b.classList.toggle('active',b.id===id+'Btn')}
const E=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const teamAliases={'Milan':'AC Milan','Ferencváros':'Ferencvaros','Sparta Praha':'Sparta Prague','Bournemouth':'AFC Bournemouth','N.E.C. Nijmegen':'NEC Nijmegen','Viktoria Plzeň':'Viktoria Plzen','Levski Sofia':'Levski Sofia','Real Sociedad':'Real Sociedad','Salzburg':'Red Bull Salzburg','AZ Alkmaar':'AZ Alkmaar','Juventus':'Juventus','Leverkusen':'Bayer Leverkusen','Marseille':'Olympique Marseille','Celtic':'Celtic','Beşiktaş':'Besiktas','Celta':'Celta Vigo','Union SG':'Union Saint-Gilloise','Benfica':'Benfica','Sunderland':'Sunderland','GNK Dinamo':'Dinamo Zagreb','Crvena Zvezda':'Red Star Belgrade','Gent':'KAA Gent','Trabzonspor':'Trabzonspor','Freiburg':'SC Freiburg','Monaco':'AS Monaco','Copenhagen':'FC Copenhagen','Twente':'FC Twente','Brighton':'Brighton and Hove Albion','Panathinaikos':'Panathinaikos','Brann':'SK Brann'};
const logos=new Map(),pending=[];let running=0;
function badge(name){const box=E('div','crest',name.slice(0,2).toUpperCase());const key=teamAliases[name]||name;if(logos.has(key)){const url=logos.get(key);if(url){const im=E('img','crest');im.alt='شعار '+name;im.loading='lazy';im.src=url;return im}return box}pending.push({key,box});queue();return box}
function queue(){while(running<5&&pending.length){const {key,box}=pending.shift();running++;fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t='+encodeURIComponent(key)).then(r=>r.ok?r.json():null).then(d=>{const team=d?.teams?.find(t=>(t.strSport||'').toLowerCase()==='soccer')||d?.teams?.[0];const url=team?.strBadge||null;logos.set(key,url);if(url&&box.isConnected){const img=E('img','crest');img.alt='شعار '+key;img.loading='lazy';img.src=url;img.onerror=()=>img.replaceWith(box);box.replaceWith(img)}}).catch(()=>logos.set(key,null)).finally(()=>{running--;queue()})}}
function matchRow(m){const row=E('div','match');const home=E('div','team home');home.append(badge(m.home),E('span','',m.home));const away=E('div','team away');away.append(badge(m.away),E('span','',m.away));row.append(home,E('div','time',m.time||'—'),away);return row}
function render(d){document.getElementById('updated').textContent='آخر تحديث: '+(d.updated_at||'غير محدد');const games=d.matches||[],news=d.news||[];document.getElementById('matchCount').textContent=games.length+' مباراة';document.getElementById('newsCount').textContent=news.length+' أخبار';const area=document.getElementById('sportsItems');area.className='';area.replaceChildren();const leagues=[...new Set(games.map(m=>m.league||'مباريات أخرى'))];for(const league of leagues){const matches=games.filter(m=>(m.league||'مباريات أخرى')===league).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const group=E('div','league'),head=E('div','league-head');head.append(E('i'),E('span','',league),E('span','num',matches.length+' مباريات'));group.append(head);matches.forEach(m=>group.append(matchRow(m)));area.append(group)}if(!games.length)area.append(E('div','empty','لا توجد مباريات موثقة'));const na=document.getElementById('newsItems');na.className='';na.replaceChildren();for(const n of news){const a=E('a','story');a.href=n.url||'#';a.target='_blank';a.rel='noopener noreferrer';a.append(E('div','cat',n.category||'أخبار'),E('h3','',n.title),E('p','',n.summary||''),E('div','source',(n.source||'المصدر')+' ↗'));na.append(a)}if(!news.length)na.append(E('div','empty','لا توجد أخبار موثقة'))}
fetch('data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(render).catch(()=>{document.getElementById('updated').textContent='تعذر تحميل بيانات اليوم';document.getElementById('sportsItems').textContent='حاول تحديث الصفحة'})</script></body></html>
